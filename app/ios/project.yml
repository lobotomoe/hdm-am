name: HDM

options:
  bundleIdPrefix: com.lobotomoe
  deploymentTarget:
    iOS: "14.0"

settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HDM:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - Assets.xcassets
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.lobotomoe.hdmam
      PRODUCT_NAME: HDM
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HDM
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: HDM needs local network access to connect to fiscal devices over TCP.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    postCompileScripts:
      - name: Build Rust executable
        basedOnDependencyAnalysis: false
        script: |
          ./build_for_ios_with_cargo.bash hdm-app
