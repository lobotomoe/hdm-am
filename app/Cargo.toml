[package]
name = "hdm-am-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alex Kraiz <selfsurfer@gmail.com>"]
description = "Native cross-platform GUI for Armenian fiscal cash registers (HDM)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lobotomoe/hdm-am"
publish = false
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hdm-app"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hdm-am = { path = ".." }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
slint = { version = "=1.13.1", default-features = false, features = [
    "backend-android-activity-06",
    "backend-winit",
    "compat-1-2",
    "renderer-software",
    "std",
] }

[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.13.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-skia",
    "renderer-software",
    "std",
] }

[build-dependencies]
slint-build = "=1.13.1"

[package.metadata.android]
package = "com.lobotomoe.hdmam"
apk_name = "hdm-am"
resources = "android/res"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "HDM"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
label = "HDM"
config_changes = "orientation|keyboardHidden|screenSize"
launch_mode = "singleTop"
exported = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
