[package]
name = "hdm-am-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local HTTP bridge that exposes an Armenian fiscal cash register (HDM) to a browser over CORS"
# Not published: depends on the library by path. Same rationale as the CLI crate.
publish = false

[package.metadata.dist]
# Ship this binary via `dist` even though `publish = false` (path dependency on the lib).
dist = true

[[bin]]
name = "hdm-bridge"
path = "src/main.rs"

[dependencies]
hdm-am = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
# Generate the OpenAPI 3.1 document for the bridge's HTTP surface. Off by default — keeps
# `schemars` out of the runtime dependency graph. Pulls the library's own `schema` feature so the
# wire types' `JsonSchema` impls are available. Generate the document with `examples/dump-openapi.rs`.
schema = ["dep:schemars", "hdm-am/schema"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true

[[example]]
name = "dump-openapi"
required-features = ["schema"]
