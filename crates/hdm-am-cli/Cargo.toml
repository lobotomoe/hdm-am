[package]
name = "hdm-am-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool for talking to an Armenian fiscal cash register (HDM) over TCP"
# Not published to crates.io for now: it depends on the library by path. To publish the binary
# later, give the dependency a version (`hdm-am = { workspace = true, version = "x.y" }`) and
# release the library first. Until then `publish = false` keeps `cargo publish` from failing.
publish = false

[package.metadata.dist]
# Ship this binary via `dist` even though `publish = false` (it depends on the lib by path and is
# not destined for crates.io).
dist = true

[[bin]]
name = "hdm"
path = "src/main.rs"

[dependencies]
hdm-am = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
rust_decimal = { workspace = true }

# Background bridge supervision (`hdm bridge start/stop/status`) sends signals and probes process
# liveness. Unix-only; on other platforms `hdm bridge run` (foreground) is offered instead.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[lints]
workspace = true
