[package]
name = "hdm-am-app"
# The GUI app is versioned independently of the library/CLI/bridge (still pre-1.0 on its own track),
# so it pins its own version rather than inheriting the workspace one.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native cross-platform GUI for Armenian fiscal cash registers (HDM)"
publish = false
build = "build.rs"

[package.metadata.dist]
# The GUI app has its own per-platform packaging (Android/iOS/macOS/Windows); it is not a `dist`
# (CLI/server) release artifact.
dist = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hdm-app"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
hdm-am = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
slint = { version = "=1.13.1", default-features = false, features = [
    "backend-android-activity-06",
    "backend-winit",
    "compat-1-2",
    "renderer-software",
    "std",
] }

[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.13.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-skia",
    "renderer-software",
    "std",
] }

# Keychain-backed secret storage (HDM password / cashier PIN). The `passwords` module is the
# iOS-safe SecItem path; the device-only accessibility class is set via a small FFI in secrets.rs
# (the safe API can't set it). Linking of Security.framework / CoreFoundation is automatic on
# Apple targets, so no build.rs or linker flags are needed.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3.7"
# `OSX_10_15` exposes `kSecUseDataProtectionKeychain` on macOS too (it is always present on iOS),
# so the same secrets.rs compiles for the dev/host build and uses the iOS-style data-protection
# keychain there for parity.
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"

[build-dependencies]
slint-build = "=1.13.1"

[package.metadata.android]
package = "com.lobotomoe.hdmam"
apk_name = "hdm-am"
resources = "android/res"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "HDM"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
label = "HDM"
config_changes = "orientation|keyboardHidden|screenSize"
launch_mode = "singleTop"
exported = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
