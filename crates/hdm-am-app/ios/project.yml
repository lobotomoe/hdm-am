name: HDM

options:
  bundleIdPrefix: com.lobotomoe
  deploymentTarget:
    iOS: "14.0"

settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HDM:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.lobotomoe.hdmam
      PRODUCT_NAME: HDM
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HDM
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "7"
        # The app's only cryptography is the HDM protocol's standard 3DES, used to talk to the
        # device. That qualifies for the export-compliance exemption, so declare it here to skip
        # the per-upload TestFlight prompt. Revisit if the crypto usage ever changes.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: HDM needs local network access to connect to Armenian fiscal cash registers over TCP.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    postCompileScripts:
      - name: Build Rust executable
        basedOnDependencyAnalysis: false
        script: |
          ./build_for_ios_with_cargo.bash hdm-app
