[package]
name = "hdm-am-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alex Kraiz <selfsurfer@gmail.com>"]
description = "Command-line tool for talking to an Armenian fiscal cash register (HDM) over TCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lobotomoe/hdm-am"
# Not published to crates.io for now: it depends on the library by path. To publish the binary
# later, give the dependency a version (`hdm-am = { path = "..", version = "x.y" }`) and release the
# library first. Until then `publish = false` keeps `cargo publish` on the workspace from failing.
publish = false

[package.metadata.dist]
# Ship this binary via `dist` even though `publish = false` (it depends on the lib by path and is
# not destined for crates.io).
dist = true

[[bin]]
name = "hdm"
path = "src/main.rs"

[dependencies]
hdm-am = { path = ".." }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rust_decimal = "1"

# Background bridge supervision (`hdm bridge start/stop/status`) sends signals and probes process
# liveness. Unix-only; on other platforms `hdm bridge run` (foreground) is offered instead.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[lints]
workspace = true
