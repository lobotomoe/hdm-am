[package]
name = "hdm-am-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alex Kraiz <selfsurfer@gmail.com>"]
description = "Local HTTP bridge that exposes an Armenian fiscal cash register (HDM) to a browser over CORS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lobotomoe/hdm-am"
# Not published: depends on the library by path. Same rationale as the CLI crate.
publish = false

[package.metadata.dist]
# Ship this binary via `dist` even though `publish = false` (path dependency on the lib).
dist = true

[[bin]]
name = "hdm-bridge"
path = "src/main.rs"

[dependencies]
hdm-am = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
