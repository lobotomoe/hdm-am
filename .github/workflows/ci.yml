name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: App packaging metadata
        run: |
          bash -n app/scripts/android-apk.bash
          bash -n app/scripts/android-aab.bash
          bash -n app/scripts/generate-icons.bash
          bash -n app/scripts/ios-build.bash
          bash -n app/scripts/macos-bundle.bash
          bash -n app/ios/build_for_ios_with_cargo.bash
          jq empty app/ios/Assets.xcassets/AppIcon.appiconset/Contents.json
          python3 -c "import plistlib; plistlib.load(open('app/ios/Info.plist', 'rb')); plistlib.load(open('app/ios/PrivacyInfo.xcprivacy', 'rb')); plistlib.load(open('app/macos/Info.plist', 'rb')); plistlib.load(open('app/macos/HDMTester.entitlements', 'rb'))"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/windows/Package.appxmanifest')"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Schema is up to date
        run: cargo run --example dump-schema --features schema -- --check

      - name: OpenAPI document is up to date
        run: cargo run -p hdm-am-bridge --example dump-openapi --features schema -- --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # MSRV covers the library and CLI that downstream consumers depend on. The native GUI pulls a
      # much larger desktop/mobile dependency graph and is covered by the stable toolchain jobs.
      - name: Build on MSRV
        run: cargo build -p hdm-am -p hdm-am-cli

  # The library, CLI, and bridge ship as cross-platform binaries (see dist-workspace.toml). Linux is
  # covered by `check`; this builds and tests them on macOS and Windows so platform-specific paths
  # (the CLI's Unix daemon supervision vs its non-Unix fallback, the bridge's SIGTERM handling) can't
  # regress. The GUI app has its own per-OS jobs and is excluded here.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.os }}
      - name: Build & test lib, CLI, bridge
        run: cargo test -p hdm-am -p hdm-am-cli -p hdm-am-bridge --all-features

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK/NDK
        run: |
          sdkmanager \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "platform-tools" \
            "platforms;android-35"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked
        env:
          RUSTFLAGS: ""
      - name: Install bundletool
        run: |
          curl -L \
            -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Check Android target
        run: app/scripts/android-apk.bash check
      - name: Build Android APK
        run: app/scripts/android-apk.bash build
      - name: Validate Android AAB packaging
        run: ANDROID_PROFILE=debug ANDROID_AAB_SOURCE_APK=target/debug/apk/hdm-am.apk app/scripts/android-aab.bash build
      - uses: actions/upload-artifact@v4
        with:
          name: hdm-am-android-debug-apk
          path: target/debug/apk/hdm-am.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hdm-am-android-debug-aab-format-check
          path: target/debug/aab/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check iOS Rust target
        run: cargo check -p hdm-am-app --target aarch64-apple-ios-sim
      - name: Generate Xcode project
        working-directory: app/ios
        run: xcodegen generate
      - name: Validate iOS metadata
        run: |
          plutil -lint app/ios/Info.plist
          plutil -lint app/ios/PrivacyInfo.xcprivacy
          python3 -m json.tool app/ios/Assets.xcassets/AppIcon.appiconset/Contents.json >/dev/null
      - name: Build iOS simulator app
        run: app/scripts/ios-build.bash simulator
      - name: Build macOS app bundle
        run: app/scripts/macos-bundle.bash bundle

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Build Windows app layout
        shell: pwsh
        run: app/scripts/windows-msix.ps1 layout
