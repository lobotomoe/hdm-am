[workspace]
members = ["app", "bridge", "cli"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "hdm-am"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alex Kraiz <selfsurfer@gmail.com>"]
description = "Client for the Armenian fiscal cash register (HDM) protocol per the State Revenue Committee spec"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lobotomoe/hdm-am"
keywords = ["armenia", "fiscal", "hdm", "ecr", "cash-register"]
categories = ["api-bindings", "hardware-support"]
readme = "README.md"
# The historical spec PDFs (~8.7 MB) live in the git repo for reference but must not bloat the
# published crate; everything else under docs/ (READMEs, schema, translation) is small and kept.
exclude = ["docs/history/*.pdf"]

[package.metadata.docs.rs]
# Build docs with the schema feature so the JsonSchema impls and the dump-schema example surface.
features = ["schema"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-float"] }
sha2 = "0.11"
des = "0.9"
ecb = "0.2"
cipher = { version = "0.5", features = ["block-padding"] }
base64 = "0.22"
thiserror = "2"
log = "0.4"
schemars = { version = "1", optional = true }

[features]
# Derive JSON Schema for every wire request/response type. Off by default — keeps `schemars`
# out of the default dependency graph. Generate the schema files with `examples/dump-schema.rs`.
schema = ["dep:schemars"]

[dev-dependencies]
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[[example]]
name = "dump-schema"
required-features = ["schema"]

[lints]
workspace = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
