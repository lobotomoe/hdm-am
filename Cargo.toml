[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alex Kraiz <selfsurfer@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lobotomoe/hdm-am"

[workspace.dependencies]
# Internal crate: every binary depends on the core library through this single declaration.
hdm-am = { path = "crates/hdm-am" }

# Shared external dependencies — single source of truth for versions. Per-crate feature sets are
# layered on at the use site with `{ workspace = true, features = [...] }`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
base64 = "0.22"
log = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
env_logger = "0.11"
schemars = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# The profile that 'dist' will build with. Profiles are only honored in the workspace root.
[profile.dist]
inherits = "release"
lto = "thin"
